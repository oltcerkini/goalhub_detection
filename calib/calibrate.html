<!doctype html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pitch calibration — pen tool</title>
<style>
  :root{--bg:#0d1117;--panel:#161b22;--line:#30363d;--fg:#e6edf3;--mut:#8b949e;
        --acc:#2f81f7;--ok:#3fb950;--warn:#d29922;--gold:#ffd740}
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
    font:13px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
  #bar{position:fixed;inset:0 0 auto 0;height:54px;display:flex;align-items:center;gap:10px;
    padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);z-index:5;
    overflow-x:auto;white-space:nowrap}
  .brand{font-weight:650;letter-spacing:.2px;white-space:nowrap}
  .brand small{color:var(--mut);font-weight:400;margin-left:7px}
  .sep{width:1px;height:26px;background:var(--line);margin:0 1px;flex:none}
  .size{display:flex;align-items:center;gap:6px;color:var(--mut);white-space:nowrap}
  select,input[type=number]{background:#0d1117;color:var(--fg);border:1px solid var(--line);
    border-radius:6px;padding:6px 7px;font:inherit}
  input[type=number]{width:62px}
  .tools{display:flex;gap:6px}
  .chip{display:inline-flex;align-items:center;gap:7px;background:#21262d;color:var(--fg);
    border:1px solid var(--line);border-radius:7px;padding:7px 11px;font:inherit;font-weight:550;
    cursor:pointer;white-space:nowrap}
  .chip:hover{background:#2b333d}
  .chip .dot{width:9px;height:9px;border-radius:50%;background:var(--c);flex:none}
  .chip.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;background:#17212f}
  .chip .tick{color:var(--ok);font-weight:700;display:none}
  .chip.done .tick{display:inline}
  .chip .x{color:var(--mut);font-weight:700;visibility:hidden;padding:0 1px}
  .chip.done .x{visibility:visible}
  .chip .x:hover{color:#ff7b72}
  .spacer{flex:1}
  .btn{background:#21262d;color:var(--fg);border:1px solid var(--line);border-radius:7px;
    padding:7px 12px;font:inherit;cursor:pointer;white-space:nowrap}
  .btn:hover{background:#2b333d}
  .btn.primary{background:var(--acc);border-color:var(--acc);color:#fff;font-weight:650;
    padding:8px 18px}
  .btn.primary:hover{background:#4a9eff}
  .btn:disabled{opacity:.5;cursor:default}
  #wrap{position:absolute;inset:54px 0 0 0;overflow:hidden;touch-action:none;cursor:default;
    background:#05070a}
  canvas{display:block;position:absolute;left:0;top:0}
  #guide{position:absolute;left:50%;top:12px;transform:translateX(-50%);max-width:480px;
    background:#0d1117e6;border:1px solid var(--line);border-radius:9px;padding:11px 13px;
    pointer-events:none;backdrop-filter:blur(4px);line-height:1.5;box-shadow:0 4px 20px #0005}
  #guide .t{font-weight:650;margin-bottom:3px}
  #guide .n{color:var(--gold)}
  #guide .k{color:var(--mut)}
  #checks{margin-top:8px;display:flex;gap:14px;color:var(--mut);font-size:12px;flex-wrap:wrap}
  #checks b{color:var(--fg);font-weight:600}
  #checks .done b{color:var(--ok)}
  #hint{position:absolute;left:50%;transform:translateX(-50%);bottom:12px;color:var(--mut);
    font-size:12px;background:#0d1117b8;border:1px solid var(--line);border-radius:7px;
    padding:6px 10px;pointer-events:none;max-width:96%;white-space:nowrap;overflow:hidden;
    text-overflow:ellipsis}
  @media (max-width:1050px){ .brand small{display:none} }
</style></head>
<body>
<div id="bar">
  <div class="brand">Pitch calibration<small>draw the field lines</small></div>
  <div class="sep"></div>
  <span class="size">Pitch
    <select id="preset"></select>
    <input type="number" id="plen" step="0.5"> ×
    <input type="number" id="pwid" step="0.5"> m
  </span>
  <div class="sep"></div>
  <div class="tools">
    <button class="chip" data-type="pitch" style="--c:#40c4ff"><span class="dot"></span><span>Pitch</span><span class="tick">✓</span><span class="x" title="remove">×</span></button>
    <button class="chip" data-type="halfway" style="--c:#e040fb"><span class="dot"></span><span>Halfway</span><span class="tick">✓</span><span class="x" title="remove">×</span></button>
    <button class="chip" data-type="centre_circle" style="--c:#ff5252"><span class="dot"></span><span>Centre circle</span><span class="tick">✓</span><span class="x" title="remove">×</span></button>
  </div>
  <div class="spacer"></div>
  <button id="openBtn" class="btn">Open frame</button>
  <button id="helpBtn" class="btn" title="Show instructions">?</button>
  <button id="undo" class="btn">Undo</button>
  <button id="clearall" class="btn">Clear</button>
  <button id="fit" class="btn">Fit</button>
  <button id="save" class="btn primary">Calibrate</button>
  <input type="file" id="file" accept="image/*" hidden>
</div>

<div id="wrap"><canvas id="cv"></canvas>
  <div id="guide"><div class="t" id="gt"></div><div id="gb"></div><div id="checks"></div></div>
  <div id="hint">Wheel = zoom · Shift-drag = pan · Backspace = remove last point · Esc = cancel · Ctrl+Z = undo</div>
</div>

<script>
// ---------------------------------------------------------------------------
// Illustrator-style pen tool for VR180 pitch calibration.
//
//   * Pick a shape (Pitch / Halfway / Centre circle).
//   * Click to drop an anchor. Click-and-DRAG to pull out the tangent handles:
//     the edge bends to follow the painted line (fisheye curves are not lines).
//   * The path closes (or finishes) automatically at the required point count.
//   * Drag square anchors to move them; drag round handles to bend an edge.
//     Alt-drag a handle to break symmetry (make a sharp corner).
//
// Saved trace schema is unchanged: {lines:[{label, points:[[x,y]...]}]}.
// ---------------------------------------------------------------------------
const $ = id => document.getElementById(id);
const cv = $('cv'), ctx = cv.getContext('2d');
const gt = $('gt'), gb = $('gb'), checks = $('checks');
const guide = $('guide'), hint = $('hint');
const QP = new URLSearchParams(location.search);
const toImg = (px,py) => [(px-view.tx)/view.s, (py-view.ty)/view.s];
const toScr = (x,y) => [x*view.s+view.tx, y*view.s+view.ty];

// count = anchors needed; labels = what each sampled segment is called in the trace
const TYPES = {
  pitch:{count:4, closed:true, color:'#40c4ff', name:'Pitch',
    labels:['touchline_far','goal_line_right','touchline_near','goal_line_left'],
    hint:'Click the four corners in order: top-left, top-right, bottom-right, bottom-left. Drag as you click so each edge hugs the painted line.'},
  halfway:{count:2, closed:false, color:'#e040fb', name:'Halfway',
    labels:['halfway'],
    hint:'Optional. Click one end on a touchline, then the other end. Drag if the line curves.'},
  centre_circle:{count:4, closed:true, color:'#ff5252', name:'Centre circle',
    labels:['centre_circle','centre_circle','centre_circle','centre_circle'],
    hint:'Optional, but it helps most. Click four points around the circle, dragging along the paint so the curve follows it.'},
};

// ---- pitch dimensions ------------------------------------------------------
const PRESETS = {
  "11v11 105×68":{length:105,width:68,penalty_depth:16.5,penalty_half:20.16,circle_r:9.15,goal_half_width:3.66,goal_height:2.44},
  "9v9 80×50":{length:80,width:50,penalty_depth:13,penalty_half:16.5,circle_r:8.0,goal_half_width:3.66,goal_height:2.13},
  "7v7 60×40":{length:60,width:40,penalty_depth:9,penalty_half:13,circle_r:6.0,goal_half_width:3.0,goal_height:2.0},
  "custom":{length:105,width:68,penalty_depth:16.5,penalty_half:20.16,circle_r:9.15,goal_half_width:3.66,goal_height:2.44}};
let pitch = Object.assign({}, PRESETS["11v11 105×68"]);
const presetSel = $('preset'), plen = $('plen'), pwid = $('pwid');
Object.keys(PRESETS).forEach(k => presetSel.append(new Option(k,k)));
const syncP = () => { plen.value = pitch.length; pwid.value = pitch.width; };
presetSel.onchange = () => { pitch = Object.assign({}, PRESETS[presetSel.value]); syncP(); };
plen.oninput = () => { pitch.length = +plen.value; presetSel.value = 'custom'; };
pwid.oninput = () => { pitch.width = +pwid.value; presetSel.value = 'custom'; };
syncP();

// ---- state -----------------------------------------------------------------
let img = new Image();
let view = {s:1, tx:0, ty:0};
let shapes = [];        // [{type, anchors:[{x,y,ix,iy,ox,oy}], closed}]
let history = [];       // undo snapshots (JSON of shapes)
let drawing = null;     // {type, anchors:[...]} while placing a path
let penDrag = -1;       // index of the anchor whose handles are being dragged
let selected = null;    // type of the shape being edited
let drag = null;        // {kind:'anchor'|'handle', type, i[, which]}
let panning = null;
let guideVisible = true;
let fitModel = null;    // projected model curves from the last calibration

const getShape = t => shapes.find(s => s.type === t);
const newAnchor = (x,y) => ({x,y, ix:0, iy:0, ox:0, oy:0});
const hIn  = a => [a.x + a.ix, a.y + a.iy];
const hOut = a => [a.x + a.ox, a.y + a.oy];

function resize(){
  const w = cv.parentElement.clientWidth, h = cv.parentElement.clientHeight;
  cv.width = w; cv.height = h;
  ctx.imageSmoothingEnabled = view.s < 1;
}
function fit(){
  if (!img.naturalWidth) { resize(); draw(); return; }
  const w = cv.parentElement.clientWidth, h = cv.parentElement.clientHeight;
  const s = Math.min(w/img.naturalWidth, h/img.naturalHeight) * 0.98;
  view = {s, tx:(w-img.naturalWidth*s)/2, ty:(h-img.naturalHeight*s)/2};
  resize(); draw();
}

// ---- geometry --------------------------------------------------------------
function bezier(p0,p1,p2,p3,seg){
  const out = [];
  for (let j=0;j<=seg;j++){
    const t=j/seg, u=1-t, u2=u*u, t2=t*t;
    out.push([
      u2*u*p0[0] + 3*u2*t*p1[0] + 3*u*t2*p2[0] + t2*t*p3[0],
      u2*u*p0[1] + 3*u2*t*p1[1] + 3*u*t2*p2[1] + t2*t*p3[1]]);
  }
  return out;
}
function sampleEdge(sh,i,seg=24){
  const n = sh.anchors.length, a = sh.anchors[i], b = sh.anchors[(i+1)%n];
  return bezier([a.x,a.y], hOut(a), hIn(b), [b.x,b.y], seg);
}
const edgeCount = sh => sh.closed ? sh.anchors.length : sh.anchors.length - 1;

function pathThrough(anchors, closed, seg){
  const n = anchors.length, ec = closed ? n : n-1;
  ctx.beginPath();
  for (let i=0;i<ec;i++){
    const a=anchors[i], b=anchors[(i+1)%n];
    bezier([a.x,a.y], hOut(a), hIn(b), [b.x,b.y], seg).forEach(([x,y],j) => {
      if (i===0 && j===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    });
  }
}

// ---- drawing ---------------------------------------------------------------
function drawShapeAnchors(sh, active){
  const t = TYPES[sh.type];
  if (active){
    for (const a of sh.anchors){
      for (const [hx,hy] of [hIn(a), hOut(a)]){
        if (Math.abs(hx-a.x) < 0.01 && Math.abs(hy-a.y) < 0.01) continue;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(hx,hy);
        ctx.strokeStyle='#8b949e'; ctx.lineWidth=1/view.s; ctx.stroke();
        ctx.beginPath(); ctx.arc(hx,hy,4/view.s,0,7); ctx.fillStyle='#e6edf3'; ctx.fill();
      }
    }
  }
  const r = (active ? 5 : 4) / view.s;
  for (const a of sh.anchors){
    ctx.fillStyle = active ? t.color : '#c9d1d9';
    ctx.fillRect(a.x-r, a.y-r, 2*r, 2*r);
    ctx.strokeStyle='#05070a'; ctx.lineWidth=1.2/view.s;
    ctx.strokeRect(a.x-r, a.y-r, 2*r, 2*r);
  }
  if (sh.closed && sh.anchors.length){
    const a = sh.anchors[0];
    ctx.beginPath(); ctx.arc(a.x,a.y,9/view.s,0,7);
    ctx.strokeStyle='#ffd740'; ctx.lineWidth=1.6/view.s; ctx.stroke();
  }
}

function drawLabels(){
  const sh = getShape('pitch');
  if (!sh || selected !== 'pitch') return;
  ctx.font = `${11/view.s}px system-ui`; ctx.textAlign='center';
  TYPES.pitch.labels.forEach((lab,i) => {
    const pts = sampleEdge(sh,i,24), m = pts[Math.floor(pts.length/2)];
    const w = ctx.measureText(lab).width / view.s;
    ctx.fillStyle='#000a'; ctx.fillRect(m[0]-w/2-3/view.s, m[1]-14/view.s, w+6/view.s, 13/view.s);
    ctx.fillStyle='#40c4ff'; ctx.fillText(lab, m[0], m[1]-4/view.s);
  });
  ctx.textAlign='left';
}

function draw(){
  ctx.setTransform(1,0,0,1,0,0);
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(view.s,0,0,view.s,view.tx,view.ty);
  if (img.complete && img.naturalWidth) ctx.drawImage(img,0,0);
  ctx.lineJoin='round'; ctx.lineCap='round';

  for (const sh of shapes){
    ctx.strokeStyle = TYPES[sh.type].color;
    ctx.lineWidth = 2.4/view.s;
    pathThrough(sh.anchors, sh.closed, 24);
    ctx.stroke();
    drawShapeAnchors(sh, selected === sh.type);
  }

  if (drawing){
    const t = TYPES[drawing.type];
    if (drawing.anchors.length > 1){
      ctx.strokeStyle = t.color; ctx.lineWidth = 2.4/view.s;
      ctx.setLineDash([7/view.s, 5/view.s]);
      pathThrough(drawing.anchors, false, 24);
      ctx.stroke(); ctx.setLineDash([]);
    }
    for (const a of drawing.anchors){
      for (const [hx,hy] of [hIn(a), hOut(a)]){
        if (Math.abs(hx-a.x) < 0.01 && Math.abs(hy-a.y) < 0.01) continue;
        ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(hx,hy);
        ctx.strokeStyle='#8b949e'; ctx.lineWidth=1/view.s; ctx.stroke();
        ctx.beginPath(); ctx.arc(hx,hy,4/view.s,0,7); ctx.fillStyle='#e6edf3'; ctx.fill();
      }
    }
    const r = 5/view.s;
    for (const a of drawing.anchors){
      ctx.fillStyle=t.color; ctx.fillRect(a.x-r,a.y-r,2*r,2*r);
      ctx.strokeStyle='#05070a'; ctx.lineWidth=1.2/view.s;
      ctx.strokeRect(a.x-r,a.y-r,2*r,2*r);
    }
    ctx.setTransform(1,0,0,1,0,0);
    drawing.anchors.forEach((a,k) => {
      const [sx,sy] = toScr(a.x,a.y);
      ctx.beginPath(); ctx.arc(sx,sy,10,0,7); ctx.fillStyle='#ffd740'; ctx.fill();
      ctx.fillStyle='#111'; ctx.font='bold 12px system-ui';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      ctx.fillText(String(k+1), sx, sy+0.5);
    });
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  }

  // fitted model from the last calibration: dashed white. If these land on the
  // painted lines, the calibration is good — no numbers needed.
  if (fitModel){
    ctx.setLineDash([7/view.s, 6/view.s]);
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=1.5/view.s;
    for (const lab in fitModel){
      const pts = fitModel[lab]; let prev = null;
      ctx.beginPath();
      for (const p of pts){
        if (!p || !isFinite(p[0]) || !isFinite(p[1])) { prev = null; continue; }
        if (prev && Math.hypot(p[0]-prev[0], p[1]-prev[1]) > 150) { ctx.moveTo(p[0],p[1]); }
        else if (prev) { ctx.lineTo(p[0],p[1]); }
        else { ctx.moveTo(p[0],p[1]); }
        prev = p;
      }
      ctx.stroke();
    }
    ctx.setLineDash([]);
  }

  drawLabels();
  updateGuide();
  syncChips();
}

// ---- guide / chips ---------------------------------------------------------
function updateGuide(){
  guide.style.display = guideVisible ? 'block' : 'none';
  if (drawing){
    const t = TYPES[drawing.type], k = drawing.anchors.length;
    gt.innerHTML = `<span class="n">${t.name}</span> — point ${Math.min(k+1,t.count)} of ${t.count}`;
    gb.innerHTML = t.hint + (k===0
      ? ' <span class="k">Tip: drag away from the point you just clicked to set the curve.</span>' : '');
  } else if (selected && getShape(selected)){
    gt.innerHTML = `<b>${TYPES[selected].name}</b> traced`;
    gb.innerHTML = '<b>Drag any line to bend it in place</b> — no new point. Drag the square ' +
                   'anchors to move them; a round handle bends one side; ' +
                   '<span class="k">Alt-drag a handle to mirror it (smooth point).</span>';
  } else {
    gt.innerHTML = 'Draw the <span class="n">Pitch</span> first';
    gb.innerHTML = 'Pick <b>Pitch</b> above, then click the four corners in order ' +
                   '(top-left → top-right → bottom-right → bottom-left). ' +
                   'Plain clicks stay straight; <b>drag while clicking</b> to curve just that edge. ' +
                   'Afterwards, <b>drag any line</b> to bend it — no extra point.';
  }
  checks.innerHTML = ['pitch','halfway','centre_circle'].map(k => {
    const done = !!getShape(k);
    return `<span class="${done?'done':''}"><b>${done?'✓':'–'}</b> ${TYPES[k].name}` +
           `${k==='pitch'?' (required)':' (optional)'}</span>`;
  }).join('');
  hint.textContent = drawing
    ? `Click point ${Math.min(drawing.anchors.length+1, TYPES[drawing.type].count)}/` +
      `${TYPES[drawing.type].count} — click-drag to curve this edge · Esc cancels · Backspace removes`
    : (selected && getShape(selected))
    ? 'Drag a line to bend it · Drag anchors to move · Alt-drag a handle to mirror · Esc deselects'
    : 'Click a shape above · Drag a line to bend it · Wheel zooms · Shift-drag pans · ? help';
}

function syncChips(){
  document.querySelectorAll('.chip').forEach(chip => {
    const k = chip.dataset.type, done = !!getShape(k);
    chip.classList.toggle('done', done);
    chip.classList.toggle('on', (drawing && drawing.type===k) || selected===k);
  });
}

// ---- hit testing -----------------------------------------------------------
function pickHandle(px,py){
  const sh = selected ? getShape(selected) : null;
  if (!sh) return null;
  let best=null, bd=11;
  sh.anchors.forEach((a,i) => {
    const cand = [['in',a.x+a.ix,a.y+a.iy], ['out',a.x+a.ox,a.y+a.oy]];
    for (const [which,x,y] of cand){
      if (Math.abs(x-a.x) < 0.01 && Math.abs(y-a.y) < 0.01) continue;
      const [sx,sy] = toScr(x,y), d = Math.hypot(sx-px, sy-py);
      if (d < bd){ bd=d; best={type:selected, i, which}; }
    }
  });
  return best;
}
function pickAnchor(px,py){
  const order = [];
  if (selected && getShape(selected)) order.push(getShape(selected));
  for (let si=shapes.length-1; si>=0; si--) if (!order.includes(shapes[si])) order.push(shapes[si]);
  let best=null, bd=11;
  for (const sh of order) sh.anchors.forEach((a,i) => {
    const [sx,sy] = toScr(a.x,a.y), d = Math.hypot(sx-px, sy-py);
    if (d < bd){ bd=d; best={type:sh.type, i}; }
  });
  return best;
}
function pickSegment(px,py){
  let best=null, bd=16;
  for (const sh of shapes){
    for (let i=0;i<edgeCount(sh);i++){
      for (const [x,y] of sampleEdge(sh,i,18)){
        const [sx,sy] = toScr(x,y), d = Math.hypot(sx-px, sy-py);
        if (d < bd){ bd=d; best={type:sh.type, seg:i}; }
      }
    }
  }
  return best;
}

// ---- interaction -----------------------------------------------------------
function snap(){ history.push(JSON.stringify(shapes)); if (history.length>100) history.shift(); }

function startDrawing(type){
  drawing = {type, anchors:[]};
  penDrag = -1; selected = null; guideVisible = true;
  draw();
}
function finishDrawing(){
  if (!drawing) return;
  const type = drawing.type;
  snap();
  shapes = shapes.filter(s => s.type !== type);
  shapes.push({type, anchors:drawing.anchors, closed:TYPES[type].closed});
  selected = type; drawing = null; penDrag = -1; guideVisible = false;
  draw();
}

cv.addEventListener('pointerdown', e => {
  if (e.shiftKey || e.button===1){
    panning = {x:e.clientX, y:e.clientY, tx:view.tx, ty:view.ty};
    cv.setPointerCapture(e.pointerId); cv.style.cursor='grabbing'; return;
  }
  if (e.button !== 0) return;
  const [x,y] = toImg(e.offsetX, e.offsetY);

  if (drawing){
    if (drawing.anchors.length === 0) guideVisible = false;
    drawing.anchors.push(newAnchor(x,y));
    penDrag = drawing.anchors.length - 1;
    cv.setPointerCapture(e.pointerId);
    draw(); return;
  }

  const hh = pickHandle(e.offsetX, e.offsetY);
  if (hh){ snap(); cv.setPointerCapture(e.pointerId); drag = {kind:'handle', ...hh}; return; }

  const ah = pickAnchor(e.offsetX, e.offsetY);
  if (ah){
    selected = ah.type; snap();
    cv.setPointerCapture(e.pointerId); drag = {kind:'anchor', ...ah}; draw(); return;
  }

  const sg = pickSegment(e.offsetX, e.offsetY);
  if (sg){
    const shp = getShape(sg.type), n = shp.anchors.length;
    const a = shp.anchors[sg.seg], b = shp.anchors[(sg.seg+1)%n];
    selected = sg.type; snap();
    drag = {kind:'bend', type:sg.type, seg:sg.seg, x0:x, y0:y,
            aox:a.ox, aoy:a.oy, bix:b.ix, biy:b.iy};
    cv.setPointerCapture(e.pointerId); draw(); return;
  }
  selected = null; draw();
});

cv.addEventListener('pointermove', e => {
  if (panning){
    view.tx = panning.tx + (e.clientX-panning.x);
    view.ty = panning.ty + (e.clientY-panning.y);
    draw(); return;
  }
  const [x,y] = toImg(e.offsetX, e.offsetY);

  if (penDrag >= 0 && drawing){
    const a = drawing.anchors[penDrag];
    a.ox = x-a.x; a.oy = y-a.y;            // curve only the edge that starts here
    draw(); return;
  }
  if (drag && drag.kind === 'bend'){
    const sh = getShape(drag.type); if (!sh) return;
    const n = sh.anchors.length;
    const a = sh.anchors[drag.seg], b = sh.anchors[(drag.seg+1)%n];
    a.ox = drag.aox + (x-drag.x0); a.oy = drag.aoy + (y-drag.y0);
    b.ix = drag.bix + (x-drag.x0); b.iy = drag.biy + (y-drag.y0);
    draw(); return;
  }
  if (drag){
    const sh = getShape(drag.type); if (!sh) return;
    const a = sh.anchors[drag.i];
    if (drag.kind === 'anchor'){ a.x = x; a.y = y; }
    else if (drag.which === 'out'){
      a.ox = x-a.x; a.oy = y-a.y;
      if (e.altKey){ a.ix = -a.ox; a.iy = -a.oy; }
    } else {
      a.ix = x-a.x; a.iy = y-a.y;
      if (e.altKey){ a.ox = -a.ix; a.oy = -a.iy; }
    }
    draw(); return;
  }
  const overPoint = pickHandle(e.offsetX,e.offsetY) || pickAnchor(e.offsetX,e.offsetY);
  cv.style.cursor = drawing ? 'crosshair'
    : overPoint ? 'move'
    : pickSegment(e.offsetX,e.offsetY) ? 'grab' : 'default';
});

cv.addEventListener('pointerup', e => {
  if (penDrag >= 0 && drawing){
    penDrag = -1;
    if (drawing.anchors.length >= TYPES[drawing.type].count) finishDrawing();
    else draw();
    return;
  }
  drag = null; panning = null;
  cv.style.cursor = 'default';
});
cv.addEventListener('pointercancel', () => { drag = null; panning = null; penDrag = -1; });

cv.addEventListener('wheel', e => {
  e.preventDefault();
  const f = e.deltaY < 0 ? 1.15 : 1/1.15, [ix,iy] = toImg(e.offsetX, e.offsetY);
  view.s *= f; view.tx = e.offsetX - ix*view.s; view.ty = e.offsetY - iy*view.s;
  draw();
}, {passive:false});

window.addEventListener('keydown', e => {
  const tag = ((e.target && e.target.tagName) || '').toLowerCase();
  if (tag === 'input' || tag === 'select' || tag === 'textarea') return;
  if (e.key === 'Escape'){
    if (drawing){ drawing = null; penDrag = -1; }
    else selected = null;
    draw();
  } else if (e.key === 'Backspace' || e.key === 'Delete'){
    if (drawing && drawing.anchors.length){
      e.preventDefault(); drawing.anchors.pop(); penDrag = -1; draw();
    }
  } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z'){
    e.preventDefault(); undo();
  }
});

function undo(){
  if (drawing){
    if (drawing.anchors.length){ drawing.anchors.pop(); penDrag = -1; }
    else drawing = null;
    draw(); return;
  }
  if (history.length){
    shapes = JSON.parse(history.pop());
    if (selected && !getShape(selected)) selected = null;
    draw();
  }
}

// ---- toolbar ---------------------------------------------------------------
document.querySelectorAll('.chip').forEach(chip => {
  const type = chip.dataset.type;
  chip.addEventListener('click', e => {
    if (e.target.classList.contains('x')){
      e.stopPropagation();
      snap();
      shapes = shapes.filter(s => s.type !== type);
      if (selected === type) selected = null;
      if (drawing && drawing.type === type) drawing = null;
      draw(); return;
    }
    if (drawing && drawing.type === type) return;
    if (getShape(type)){ drawing = null; selected = type; draw(); }
    else startDrawing(type);
  });
});

$('undo').onclick = undo;
$('fit').onclick = fit;
$('helpBtn').onclick = () => { guideVisible = !guideVisible; draw(); };
$('clearall').onclick = () => {
  if (confirm('Clear all shapes?')){ snap(); shapes = []; selected = null; drawing = null; draw(); }
};
$('openBtn').onclick = () => $('file').click();
$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  const n = new Image(); n.dataset.name = f.name;
  n.onload = () => { img = n; shapes = []; history = []; selected = null; drawing = null; fit(); };
  n.onerror = () => { gb.textContent = 'Could not read that image file.'; };
  n.src = URL.createObjectURL(f);
};

// ---- save / calibrate ------------------------------------------------------
$('save').textContent = QP.get('api') ? 'Calibrate' : 'Save trace';

$('save').onclick = async () => {
  const ps = getShape('pitch');
  if (!ps){ alert('Trace the pitch first — it is required for calibration.'); return; }

  const lines = [];
  const add = (label, pts) => lines.push({
    label, points: pts.map(p => [+p[0].toFixed(1), +p[1].toFixed(1)]) });
  TYPES.pitch.labels.forEach((lab,i) => add(lab, sampleEdge(ps,i,24)));
  const hs = getShape('halfway');
  if (hs) add('halfway', sampleEdge(hs,0,24));
  const cc = getShape('centre_circle');
  if (cc){
    const whole = [];
    for (let i=0;i<edgeCount(cc);i++) whole.push(...sampleEdge(cc,i,16));
    add('centre_circle', whole);
  }

  const data = {
    image: img.dataset.name || 'frame.jpg',
    size: [img.naturalWidth, img.naturalHeight],
    span: 180, crop: null,
    pitch: Object.assign({}, pitch, {length:+plen.value, width:+pwid.value}),
    lines
  };

  const api = QP.get('api');
  if (!api){                                   // standalone: download the trace
    const blob = new Blob([JSON.stringify(data,null,1)], {type:'application/json'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = 'calib_equirect.json'; a.click();
    return;
  }

  const btn = $('save'), old = btn.textContent;
  btn.disabled = true; btn.textContent = 'Calibrating…';
  try {
    const r = await fetch(api.replace(/\/$/,'') + '/api/calibrate', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({video_id: QP.get('video_id'), trace: data}) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.detail || ('HTTP '+r.status));
    const q = j.quality || {};
    const sus = (q.suspect_labels || []);
    const msg = `Calibrated — fit ${q.med_px != null ? q.med_px.toFixed(1) : '?'} px · `
      + `valid=${q.valid} · ${q.corners_in_frame}/4 corners`
      + (sus.length ? ` · check: ${sus.join(', ')}` : '')
      + ' — white dashed = fitted pitch; it should sit on the paint.';
    gb.textContent = msg;
    if (j.model_curves){ fitModel = j.model_curves; draw(); }
    if (window.parent !== window)
      window.parent.postMessage({type:'gh-calibrated', quality:q}, '*');
    else alert(msg);
  } catch (err){
    alert('Calibration failed: ' + err.message);
  } finally {
    btn.disabled = false; btn.textContent = old;
  }
};

// ---- boot ------------------------------------------------------------------
const qimg = QP.get('img');
img.dataset.name = qimg ? qimg.split('/').pop() : 'frame_85s.jpg';
img.onload = fit;
img.onerror = () => { gb.textContent = 'No frame loaded — use “Open frame”.'; };
img.src = qimg || 'frame_85s.jpg';

window.addEventListener('resize', () => { resize(); draw(); });
resize(); draw();
</script></body></html>
