<!doctype html>
<html><head><meta charset="utf-8">
<title>Equirect pitch calibration — pen tool</title>
<style>
  :root{--bg:#14181d;--fg:#e8eaed;--mut:#9aa0a6;--acc:#4c8bf5}
  *{box-sizing:border-box} html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);
    font:13px/1.4 system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
  #bar{position:fixed;inset:0 0 auto 0;min-height:46px;display:flex;gap:8px;align-items:center;
    padding:6px 10px;background:#1b2027;border-bottom:1px solid #2a313a;z-index:5;flex-wrap:wrap}
  button,select,input[type=file],input[type=number]{background:#232a33;color:var(--fg);
    border:1px solid #333c47;border-radius:6px;padding:6px 9px;font:inherit;cursor:pointer}
  button:hover{background:#2b333d} button.on{background:var(--acc);border-color:var(--acc)}
  #wrap{position:absolute;inset:46px 0 0 0;overflow:hidden;touch-action:none;cursor:crosshair}
  canvas{display:block;position:absolute;left:0;top:0}
  #hint{position:absolute;left:10px;bottom:10px;max-width:720px;background:#000b;padding:9px 12px;
    border-radius:6px;color:var(--mut);font-size:12.5px;pointer-events:none;line-height:1.55}
  #hint b{color:var(--fg)} #hint .step{color:#ffd740;font-weight:600}
  #info{margin-left:auto;color:var(--mut);font-variant-numeric:tabular-nums}
  .grp{display:flex;gap:6px;align-items:center;color:var(--mut)}
  .swatch{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:middle}
</style></head>
<body>
<div id="bar">
  <input type="file" id="file" accept="image/*">
  <span class="grp"><b>Pitch:</b>
    <select id="preset"></select>
    <input type="number" id="plen" step="0.5" style="width:64px"> ×
    <input type="number" id="pwid" step="0.5" style="width:64px"> m
  </span>
  <button id="t_pitch">Pitch <span class="swatch" style="background:#40c4ff"></span></button>
  <button id="t_goal_left">Goal L <span class="swatch" style="background:#69f0ae"></span></button>
  <button id="t_goal_right">Goal R <span class="swatch" style="background:#ffd740"></span></button>
  <button id="t_halfway">Halfway <span class="swatch" style="background:#e040fb"></span></button>
  <button id="undo">Undo</button>
  <button id="clearall">Clear</button>
  <button id="save">Save JSON</button>
  <button id="fit">Fit</button>
  <span id="info"></span>
</div>
<div id="wrap"><canvas id="cv"></canvas>
  <div id="hint"></div>
</div>
<script>
// ---------------------------------------------------------------------------
// Guided pen tool. Click a shape, then click its corners IN THE ORDER the bar
// tells you (top-left -> top-right -> bottom-right -> bottom-left). Then shape
// each edge: click a point ON the line and it bends to it immediately; drag any
// point/corner to fine-tune; alt-click a point to remove. Edges are Catmull-Rom
// splines through the corners + added points (unlimited points per edge).
// ---------------------------------------------------------------------------
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
const info=document.getElementById('info'), hint=document.getElementById('hint');

// cnames = the order you click the corners. edgeLabels[i] labels edge i->i+1.
const TYPES={
  pitch:{corners:4, closed:true, color:'#40c4ff', name:'Pitch',
    cnames:['top-left','top-right','bottom-right','bottom-left'],
    note:'Top edge = FAR touchline · bottom edge = NEAR touchline · left edge = LEFT goal, right edge = RIGHT goal.',
    edgeLabels:['touchline_far','goal_line_right','touchline_near','goal_line_left']},
  goal_left:{corners:4, closed:true, color:'#69f0ae', name:'Goal left',
    cnames:['post · top-left','post · top-right','post · bottom-right','post · bottom-left'],
    note:'The goal mouth: top = crossbar, bottom = the goal line on the grass.',
    edgeLabels:['goal_top','goal_right','goal_ground','goal_left']},
  goal_right:{corners:4, closed:true, color:'#ffd740', name:'Goal right',
    cnames:['post · top-left','post · top-right','post · bottom-right','post · bottom-left'],
    note:'The goal mouth: top = crossbar, bottom = the goal line on the grass.',
    edgeLabels:['goal_top','goal_right','goal_ground','goal_left']},
  halfway:{corners:2, closed:false, color:'#e040fb', name:'Halfway',
    cnames:['one end (on a touchline)','other end (on the other touchline)'],
    note:'Optional — the pitch outline alone is enough.',
    edgeLabels:['halfway']},
};

// ---- pitch dimensions (the system asks for the real pitch size) ----
const PRESETS={
  "11v11 105×68":{length:105,width:68,penalty_depth:16.5,penalty_half:20.16,circle_r:9.15,goal_half_width:3.66,goal_height:2.44},
  "9v9 80×50":{length:80,width:50,penalty_depth:13,penalty_half:16.5,circle_r:8.0,goal_half_width:3.66,goal_height:2.13},
  "7v7 60×40":{length:60,width:40,penalty_depth:9,penalty_half:13,circle_r:6.0,goal_half_width:3.0,goal_height:2.0},
  "custom":{length:105,width:68,penalty_depth:16.5,penalty_half:20.16,circle_r:9.15,goal_half_width:3.66,goal_height:2.44}};
let pitch=Object.assign({},PRESETS["11v11 105×68"]);
const presetSel=document.getElementById('preset'), plen=document.getElementById('plen'), pwid=document.getElementById('pwid');
Object.keys(PRESETS).forEach(k=>presetSel.append(new Option(k,k)));
const syncP=()=>{plen.value=pitch.length; pwid.value=pitch.width;};
presetSel.onchange=()=>{pitch=Object.assign({},PRESETS[presetSel.value]); syncP();};
plen.oninput=()=>{pitch.length=+plen.value; presetSel.value='custom';};
pwid.oninput=()=>{pitch.width=+pwid.value; presetSel.value='custom';};
syncP();

// ---- state ----
let img=new Image(), view={s:1,tx:0,ty:0};
let shapes=[];            // [{type, corners:[[x,y]..], knots:[[ [x,y].. ]..]}]
let history=[];           // undo snapshots
let tool=null;            // active placement type
let pending=[];           // corners clicked so far for the active tool
let drag=null;            // {si, kind:'corner'|'knot', i, k}
let panning=null;
const toImg=(px,py)=>[(px-view.tx)/view.s,(py-view.ty)/view.s];
const toScr=(x,y)=>[x*view.s+view.tx, y*view.s+view.ty];

function resize(){const w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;
  cv.width=w;cv.height=h;ctx.imageSmoothingEnabled=view.s<1;}
function fit(){const w=cv.parentElement.clientWidth,h=cv.parentElement.clientHeight;
  const s=Math.min(w/img.naturalWidth,h/img.naturalHeight)*0.98;
  view={s,tx:(w-img.naturalWidth*s)/2,ty:(h-img.naturalHeight*s)/2};resize();draw();}

// ---- geometry ----
const edgeCount=(sh)=>{const n=sh.corners.length; return TYPES[sh.type].closed?n:n-1;};
const controlPts=(sh,i)=>{const n=sh.corners.length; return [sh.corners[i], ...(sh.knots[i]||[]), sh.corners[(i+1)%n]];};
function catmullRom(pts,seg=14){
  if(pts.length<2) return pts.map(p=>[p[0],p[1]]);
  const P=[pts[0],...pts,pts[pts.length-1]], out=[];
  for(let i=1;i<P.length-2;i++){ const p0=P[i-1],p1=P[i],p2=P[i+1],p3=P[i+2];
    for(let j=0;j<seg;j++){ const t=j/seg,t2=t*t,t3=t2*t;
      out.push([
        0.5*(2*p1[0]+(-p0[0]+p2[0])*t+(2*p0[0]-5*p1[0]+4*p2[0]-p3[0])*t2+(-p0[0]+3*p1[0]-3*p2[0]+p3[0])*t3),
        0.5*(2*p1[1]+(-p0[1]+p2[1])*t+(2*p0[1]-5*p1[1]+4*p2[1]-p3[1])*t2+(-p0[1]+3*p1[1]-3*p2[1]+p3[1])*t3)]); } }
  out.push([pts[pts.length-1][0],pts[pts.length-1][1]]); return out;
}
const sampleEdge=(sh,i,seg=14)=>catmullRom(controlPts(sh,i),seg);
const withDefaults=(type,corners)=>({type, corners:corners.map(p=>[p[0],p[1]]),
  knots:Array.from({length:TYPES[type].closed?corners.length:corners.length-1},()=>[])});

// ---- draw ----
function draw(){
  ctx.setTransform(1,0,0,1,0,0); ctx.clearRect(0,0,cv.width,cv.height);
  ctx.setTransform(view.s,0,0,view.s,view.tx,view.ty);
  if(img.complete&&img.naturalWidth) ctx.drawImage(img,0,0);
  ctx.lineJoin='round'; ctx.lineCap='round';
  const R=4/view.s;

  shapes.forEach(sh=>{
    const t=TYPES[sh.type]; ctx.strokeStyle=t.color; ctx.lineWidth=2.5/view.s;
    for(let i=0;i<edgeCount(sh);i++){ const s=sampleEdge(sh,i);
      ctx.beginPath(); s.forEach(([x,y],j)=>j?ctx.lineTo(x,y):ctx.moveTo(x,y)); ctx.stroke(); }
    sh.corners.forEach(([x,y],i)=>{
      if(t.closed && i===0){ // highlight the start corner
        ctx.beginPath(); ctx.arc(x,y,9/view.s,0,7); ctx.strokeStyle='#ffd740'; ctx.lineWidth=2/view.s; ctx.stroke(); }
      ctx.fillStyle=t.color; ctx.fillRect(x-R,y-R,2*R,2*R);
      ctx.strokeStyle='#000'; ctx.lineWidth=1/view.s; ctx.strokeRect(x-R,y-R,2*R,2*R); });
    sh.knots.forEach(ks=>ks.forEach(([x,y])=>{ ctx.beginPath(); ctx.arc(x,y,4.5/view.s,0,7);
      ctx.fillStyle='#14181d'; ctx.fill(); ctx.strokeStyle=t.color; ctx.lineWidth=2/view.s; ctx.stroke(); }));
  });

  // live edge labels for the pitch (by the guided order)
  const ps=shapes.find(s=>s.type==='pitch');
  if(ps){ const labs=TYPES.pitch.edgeLabels; ctx.font=`${11/view.s}px system-ui`;
    for(let i=0;i<edgeCount(ps);i++){ const s=sampleEdge(ps,i,14), m=s[Math.floor(s.length/2)];
      ctx.fillStyle='#000'; const w=ctx.measureText(labs[i]).width/view.s;
      ctx.fillRect(m[0]-w/2-2/view.s, m[1]-13/view.s, w+4/view.s, 12/view.s);
      ctx.fillStyle=ps&&i===0?'#ffd740':'#40c4ff'; ctx.textAlign='center'; ctx.fillText(labs[i],m[0],m[1]-4/view.s); }
    ctx.textAlign='left'; }

  // placement feedback: numbered corners
  ctx.setTransform(1,0,0,1,0,0);
  pending.forEach((p,k)=>{ const [sx,sy]=toScr(...p), r=11;
    ctx.beginPath(); ctx.arc(sx,sy,r,0,7); ctx.fillStyle='#ffd740'; ctx.fill();
    ctx.fillStyle='#111'; ctx.font='bold 13px system-ui'; ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillText(String(k+1),sx,sy+0.5); });
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';

  info.textContent=`${img.naturalWidth||0}×${img.naturalHeight||0} · ${shapes.length} shape(s) · zoom ${view.s.toFixed(2)}×`;
  if(tool){
    const t=TYPES[tool], k=pending.length;
    hint.innerHTML = `Placing <b>${t.name}</b> — click corner <span class="step">${k+1}/${t.corners}: ${t.cnames[k].toUpperCase()}</span>`+
      (t.note?`<br>${t.note}`:'')+`<br>Esc cancels.`;
  } else if(shapes.length){
    hint.innerHTML = `Shape the lines: <b>click any point on a line and it bends to it immediately</b> · drag points/corners to fine-tune · `+
      `<b>alt-click</b> a point to remove · wheel = zoom · shift-drag = pan.`;
  } else {
    hint.innerHTML = `Start with <b>Pitch</b>: click its 4 corners in the order shown (top-left → top-right → bottom-right → bottom-left), `+
      `then click along each line to curve it.`;
  }
}

// ---- hit testing ----
const R_SCREEN=12;
function pickPoint(px,py){
  for(let si=shapes.length-1;si>=0;si--){ const sh=shapes[si];
    for(let i=0;i<sh.corners.length;i++){ const [sx,sy]=toScr(...sh.corners[i]);
      if(Math.hypot(sx-px,sy-py)<R_SCREEN) return {si,kind:'corner',i}; }
    for(let i=0;i<sh.knots.length;i++) for(let k=0;k<sh.knots[i].length;k++){
      const [sx,sy]=toScr(...sh.knots[i][k]);
      if(Math.hypot(sx-px,sy-py)<R_SCREEN) return {si,kind:'knot',i,k}; } }
  return null;
}
function pickEdge(px,py){          // nearest edge, UNBOUNDED: click anywhere along the real line
  let best=null,bd=Infinity;
  shapes.forEach((sh,si)=>{ for(let i=0;i<edgeCount(sh);i++){ const s=sampleEdge(sh,i);
    for(const [x,y] of s){ const [sx,sy]=toScr(x,y),d=Math.hypot(sx-px,sy-py);
      if(d<bd){bd=d;best={si,i};} } } });
  return best;
}
function insertKnotAt(sh,i,imgPt){
  const cps=controlPts(sh,i), seg=14, s=catmullRom(cps,seg);
  let bi=0,bd=1e9; s.forEach((p,j)=>{const d=Math.hypot(p[0]-imgPt[0],p[1]-imgPt[1]); if(d<bd){bd=d;bi=j;}});
  const a=Math.min(cps.length-2,Math.floor(bi/seg));
  sh.knots[i].splice(a,0,[imgPt[0],imgPt[1]]); return a;
}

// ---- interaction ----
function snap(){ history.push(JSON.stringify(shapes)); if(history.length>80) history.shift(); }

cv.addEventListener('pointerdown',e=>{
  if(e.shiftKey||e.button===1){ panning=[e.clientX,e.clientY,view.tx,view.ty]; return; }
  const [x,y]=toImg(e.offsetX,e.offsetY);
  if(tool){
    pending.push([x,y]);
    if(pending.length>=TYPES[tool].corners){ snap(); shapes=shapes.filter(s=>s.type!==tool);
      shapes.push(withDefaults(tool,pending)); pending=[]; setTool(null); }
    draw(); return;
  }
  const hit=pickPoint(e.offsetX,e.offsetY);
  if(hit){
    if(e.altKey && hit.kind==='knot'){ snap(); shapes[hit.si].knots[hit.i].splice(hit.k,1); draw(); return; }
    snap(); cv.setPointerCapture(e.pointerId); drag=hit; return;
  }
  const ed=pickEdge(e.offsetX,e.offsetY);            // click the real line -> point added & bent at once
  if(ed){ snap(); const k=insertKnotAt(shapes[ed.si],ed.i,[x,y]);
    cv.setPointerCapture(e.pointerId); drag={si:ed.si,kind:'knot',i:ed.i,k}; draw(); }
});
cv.addEventListener('pointermove',e=>{
  if(panning){ view.tx=panning[2]+(e.clientX-panning[0]); view.ty=panning[3]+(e.clientY-panning[1]); draw(); return; }
  if(drag){ const [x,y]=toImg(e.offsetX,e.offsetY), sh=shapes[drag.si];
    if(drag.kind==='corner') sh.corners[drag.i]=[x,y]; else sh.knots[drag.i][drag.k]=[x,y]; draw(); }
});
const endDrag=()=>drag=null;
cv.addEventListener('pointerup',endDrag);
cv.addEventListener('pointercancel',endDrag);
cv.addEventListener('wheel',e=>{ e.preventDefault();
  const f=e.deltaY<0?1.15:1/1.15,[ix,iy]=toImg(e.offsetX,e.offsetY);
  view.s*=f; view.tx=e.offsetX-ix*view.s; view.ty=e.offsetY-iy*view.s; draw(); },{passive:false});
window.addEventListener('mouseup',()=>panning=null);
window.addEventListener('keydown',e=>{ if(e.key==='Escape'){ pending=[]; setTool(null); draw(); }
  else if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='z'){ e.preventDefault(); undo(); } });

function setTool(t){ tool=t;
  for(const k of Object.keys(TYPES)) document.getElementById('t_'+k).classList.toggle('on',k===t);
  if(t) pending=[]; draw(); }
for(const k of Object.keys(TYPES)) document.getElementById('t_'+k).onclick=()=>setTool(tool===k?null:k);

function undo(){ if(pending.length){ pending.pop(); draw(); return; } if(history.length) shapes=JSON.parse(history.pop()); draw(); }
document.getElementById('undo').onclick=undo;
document.getElementById('clearall').onclick=()=>{ if(confirm('Clear all shapes?')){ snap(); shapes=[];pending=[];setTool(null);draw(); } };
document.getElementById('fit').onclick=fit;

document.getElementById('save').onclick=()=>{
  const lines=[]; const add=(label,pts)=>lines.push({label,points:pts.map(p=>[+p[0].toFixed(1),+p[1].toFixed(1)])});
  const ps=shapes.find(s=>s.type==='pitch');
  if(ps) TYPES.pitch.edgeLabels.forEach((lab,i)=>add(lab,sampleEdge(ps,i,24)));
  for(const t of ['goal_left','goal_right']){ const sh=shapes.find(s=>s.type===t); if(!sh) continue;
    const whole=[]; for(let i=0;i<edgeCount(sh);i++) whole.push(...sampleEdge(sh,i,16)); add(t,whole);
    add(t==='goal_left'?'goal_line_left':'goal_line_right', sampleEdge(sh,2,24)); }   // edge 2 = goal line on grass
  const hs=shapes.find(s=>s.type==='halfway'); if(hs) add('halfway', sampleEdge(hs,0,24));

  if(!lines.length){ alert('Nothing to save — draw at least the pitch.'); return; }
  const data={ image:img.dataset.name||'frame.jpg', size:[img.naturalWidth,img.naturalHeight],
    span:180, crop:null, pitch:Object.assign({},pitch,{length:+plen.value,width:+pwid.value}), lines };
  const blob=new Blob([JSON.stringify(data,null,1)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='calib_equirect.json'; a.click();
};
document.getElementById('file').onchange=e=>{const f=e.target.files[0]; if(!f)return;
  const n=new Image(); n.dataset.name=f.name; n.onload=fit; n.src=URL.createObjectURL(f);
  img=n; shapes=[]; history=[]; pending=[]; setTool(null); };
img.dataset.name='frame_85s.jpg'; img.onload=fit;
img.onerror=()=>{info.textContent='load an equirect frame with the file picker';};
img.src='frame_85s.jpg';
window.addEventListener('resize',()=>{resize();draw();});
setTool(null); resize(); draw();
</script></body></html>
